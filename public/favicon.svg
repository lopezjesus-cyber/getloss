<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Fondo Squircle Titanio Oscuro -->
    <linearGradient id="favBgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1c1c21" />
      <stop offset="50%" stopColor="#0d0d11" />
      <stop offset="100%" stopColor="#000000" />
    </linearGradient>

    <!-- Borde Metálico Titanio Cepillado -->
    <linearGradient id="favBorderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.85" />
      <stop offset="40%" stopColor="#71717a" stopOpacity="0.35" />
      <stop offset="70%" stopColor="#27272a" stopOpacity="0.55" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0.75" />
    </linearGradient>

    <!-- Gradiente Metálico para el Escudo getloss -->
    <linearGradient id="favShieldGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="40%" stopColor="#e4e4e7" />
      <stop offset="80%" stopColor="#a1a1aa" />
      <stop offset="100%" stopColor="#ffffff" />
    </linearGradient>

    <!-- Gradiente para la Flecha Ascendente de Cero Fugas -->
    <linearGradient id="favArrowGrad" x1="16" y1="48" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#a1a1aa" />
      <stop offset="50%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Squircle Base con Borde de Precisión -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favBgGrad)" stroke="url(#favBorderGrad)" stroke-width="2" />

  <!-- Brillo de Zafiro Superior -->
  <path d="M4 16C4 9.37 9.37 4 16 4H48C54.63 4 60 9.37 60 16V28C48 26 16 26 4 28V16Z" fill="#ffffff" fill-opacity="0.12" />

  <!-- Escudo Exterior getloss -->
  <path
    d="M32 10L49 18.5V34C49 43 41.5 50.5 32 53C22.5 50.5 15 43 15 34V18.5L32 10Z"
    fill="#09090b"
    stroke="url(#favShieldGrad)"
    stroke-width="2.8"
    stroke-linejoin="round"
  />

  <!-- Núcleo de Crecimiento & Vértice de Precisión -->
  <path
    d="M32 17L41.5 22.5V32.5C41.5 38 37.5 42.5 32 44.5C26.5 42.5 22.5 38 22.5 32.5V22.5L32 17Z"
    fill="rgba(255, 255, 255, 0.08)"
    stroke="rgba(255, 255, 255, 0.45)"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- Flecha Vectorial Ascendente de Ganancia Neta -->
  <path
    d="M24 35.5L30.5 27.5L35 31.5L40.5 22.5"
    stroke="url(#favArrowGrad)"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M35 22.5H40.5V28"
    stroke="#ffffff"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Punto de Precisión Superior -->
  <circle cx="32" cy="10" r="2" fill="#ffffff" />
</svg>